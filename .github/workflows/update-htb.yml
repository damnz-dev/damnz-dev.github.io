name: Actualizar Metricas HTB

on:
  schedule:
    # Se ejecuta todos los dias a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar insignia y verificar conectividad
        run: |
          curl -s -f -o badge.png "https://www.hackthebox.com/badge/image/3419151" || echo "Badge descargado"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "damnz-dev"
          git config user.email "354959975+damnz-dev@users.noreply.github.com"
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(cron): sincronización automática HTB"
            git push
          else
            echo "Sin cambios en las métricas."
          fi
